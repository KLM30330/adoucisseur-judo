# =====================================================================
#  JUDO Quicksoft-M — ESP8266 (NodeMCU) en ÉCOUTE SEULE
#  Le module Connectivity JUDO reste branché et interroge l'adoucisseur ;
#  l'ESP décode passivement les échanges. Il n'émet jamais.
#
#  Câblage :
#    Module RX (données reçues)   -> GPIO13 (D7)
#    Module TX (entrée émetteur)  -> 3,3 V (le module ne doit jamais émettre)
#    Module VCC -> 3V3, GND -> GND ; A/B -> bornier A1/A2 (en parallèle du module JUDO)
# =====================================================================

esphome:
  name: adoucisseur-judo
  friendly_name: Adoucisseur JUDO

esp8266:
  board: nodemcuv2

# L'UART est réservé au bus RS485 : pas de logs série (les logs restent dispo en Wi-Fi)
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Adoucisseur-JUDO Fallback
    password: !secret ap_password

captive_portal:

external_components:
  - source:
      type: local
      path: ../components
    components: [judo_bus]

uart:
  id: uart_judo
  rx_pin: GPIO13            # UART0 matériel en position swap
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

judo_bus:
  id: judo
  uart_id: uart_judo
  address: 0x01
  device_type: 0x38
  bus_timeout: 5min             # bus considéré muet au-delà
  maintenance_warning_days: 14  # alerte maintenance 14 jours avant l'échéance (0 = à l'échéance)
  log_unknown_changes: true     # journalise toute évolution non décodée (capture des régénérations)
  master: false                 # écoute seule : le module Connectivity reste maître
  log_raw_frames: false         # true = journal brut de chaque trame (diagnostic)
  capacity_threshold: 3000      # compteur de capacité au déclenchement d'une régénération (à confirmer)

  # --- Valeurs confirmées ---
  soft_water_total:
    name: "Adoucisseur eau adoucie totale"
  flow_rate:
    name: "Adoucisseur débit"
  regeneration_count:
    name: "Adoucisseur régénérations"
  raw_hardness:
    name: "Adoucisseur dureté eau brute"
    unit_of_measurement: "°f"
  residual_hardness:
    name: "Adoucisseur dureté résiduelle"
    unit_of_measurement: "°f"
  maintenance_days:
    name: "Adoucisseur jours avant maintenance"
  operating_days:
    name: "Adoucisseur jours de fonctionnement"
  device_number:
    name: "Adoucisseur numéro d'appareil"
  hardware_version:
    name: "Adoucisseur version matérielle"      # « version périphérique » dans l'app (5.20)
  software_version:
    name: "Adoucisseur version logicielle"      # 1.05
  hardness_unit:
    name: "Adoucisseur unité de dureté"

  # --- Alertes ---
  # Alerte sel MÉMORISÉE : s'active si la saumure n'est pas détectée (surtout pendant
  # l'aspiration de la régénération) et reste active jusqu'à une régénération complète
  # sans défaut, ou jusqu'à l'appui sur « Adoucisseur sel rechargé ».
  salt_shortage:
    name: "Adoucisseur manque de sel"
  maintenance_due:
    name: "Adoucisseur maintenance due"
  regeneration:
    name: "Adoucisseur régénération"         # temps réel (octet 0, bit 0)
  water_today:
    name: "Adoucisseur eau adoucie aujourd'hui"
  flow_instant:
    name: "Adoucisseur débit instantané"
  regeneration_remaining:
    name: "Adoucisseur régénération temps restant phase"
  capacity_remaining:
    name: "Adoucisseur capacité restante"
  capacity_at_regeneration:
    name: "Adoucisseur capacité au déclenchement"
  bus_ok:
    name: "Adoucisseur liaison RS485"
  last_event:
    name: "Adoucisseur dernier événement"
  unknown_change:
    name: "Adoucisseur évolution inconnue"
  bus_diagnostic:
    name: "Adoucisseur diagnostic bus"

  # --- Expérimental (signification à confirmer) ---
  message_history:
    name: "Adoucisseur historique messages"
  status_countdown:
    name: "Adoucisseur compte à rebours (expérimental)"
  capacity_counter:
    name: "Adoucisseur compteur capacité (expérimental)"
  flow_indicator:
    name: "Adoucisseur indicateur débit (expérimental)"

button:
  # Acquitte l'alerte sel après rechargement (sinon effacée à la prochaine régénération correcte)
  - platform: template
    name: "Adoucisseur sel rechargé"
    icon: mdi:shaker
    on_press:
      - lambda: id(judo).reset_salt_alarm();
  - platform: restart
    name: "Redémarrer"
    entity_category: diagnostic
